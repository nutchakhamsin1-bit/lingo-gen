<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120">
  <!-- หน้ามังงะตัวอย่าง — ตำแหน่งกรอบข้อความต้องตรงกับ SAMPLE_TEXT_REGIONS ใน src/services/translation/sampleContent.ts -->
  <defs>
    <pattern id="tone" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.7" fill="#9c9c9c" />
    </pattern>
    <pattern id="tone-light" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1" fill="#c4c4c4" />
    </pattern>
  </defs>
  <rect width="800" height="1120" fill="#ffffff" />

  <g font-family="'Comic Sans MS', 'Comic Neue', 'Segoe UI', sans-serif" font-weight="700" text-anchor="middle" fill="#111">
    <!-- ช่อง 1: วิ่งตาม -->
    <rect x="30" y="30" width="740" height="330" fill="url(#tone-light)" />
    <g stroke="#9a9a9a" stroke-width="2">
      <line x1="770" y1="250" x2="420" y2="250" />
      <line x1="770" y1="280" x2="470" y2="280" />
      <line x1="770" y1="310" x2="390" y2="310" />
      <line x1="770" y1="335" x2="500" y2="335" />
    </g>
    <path d="M150 262 h80 l24 98 h-128 z" fill="#4a4a4a" />
    <circle cx="190" cy="215" r="42" fill="#2b2b2b" />
    <circle cx="205" cy="222" r="5" fill="#fff" />
    <g fill="#fff" stroke="#111" stroke-width="6">
      <ellipse cx="540" cy="140" rx="175" ry="78" />
      <path d="M425 180 L258 206 L470 200 Z" />
    </g>
    <g fill="#fff">
      <ellipse cx="540" cy="140" rx="175" ry="78" />
      <path d="M425 180 L258 206 L470 200 Z" />
    </g>
    <text x="540" y="128" font-size="30">Hey!</text>
    <text x="540" y="164" font-size="30">Wait for me!</text>
    <rect x="30" y="30" width="740" height="330" fill="none" stroke="#111" stroke-width="5" />

    <!-- ช่อง 2: ถาม -->
    <rect x="30" y="660" width="360" height="80" fill="url(#tone-light)" />
    <path d="M100 690 h100 l22 50 h-144 z" fill="#4a4a4a" />
    <circle cx="150" cy="640" r="48" fill="#2b2b2b" />
    <circle cx="170" cy="645" r="5" fill="#fff" />
    <g fill="#fff" stroke="#111" stroke-width="6">
      <ellipse cx="225" cy="480" rx="150" ry="72" />
      <path d="M190 540 L165 586 L225 548 Z" />
    </g>
    <g fill="#fff">
      <ellipse cx="225" cy="480" rx="150" ry="72" />
      <path d="M190 540 L165 586 L225 548 Z" />
    </g>
    <text x="225" y="472" font-size="25">Where are you</text>
    <text x="225" y="504" font-size="25">going?</text>
    <rect x="30" y="380" width="360" height="360" fill="none" stroke="#111" stroke-width="5" />

    <!-- ช่อง 3: ตอบ -->
    <rect x="410" y="560" width="360" height="180" fill="url(#tone)" />
    <path d="M590 690 h100 l22 50 h-144 z" fill="#4a4a4a" />
    <circle cx="640" cy="640" r="48" fill="#2b2b2b" />
    <g fill="none" stroke="#fff" stroke-width="3">
      <circle cx="620" cy="645" r="12" />
      <circle cx="652" cy="645" r="12" />
      <line x1="632" y1="645" x2="640" y2="645" />
    </g>
    <g fill="#fff" stroke="#111" stroke-width="6">
      <ellipse cx="575" cy="475" rx="140" ry="66" />
      <path d="M595 535 L645 592 L625 530 Z" />
    </g>
    <g fill="#fff">
      <ellipse cx="575" cy="475" rx="140" ry="66" />
      <path d="M595 535 L645 592 L625 530 Z" />
    </g>
    <text x="575" y="466" font-size="27">To the</text>
    <text x="575" y="499" font-size="27">library.</text>
    <rect x="410" y="380" width="360" height="360" fill="none" stroke="#111" stroke-width="5" />

    <!-- ช่อง 4: ไปด้วยกัน -->
    <rect x="560" y="820" width="210" height="270" fill="url(#tone)" />
    <path d="M560 830 L664 775 L767 830 Z" fill="#6a6a6a" />
    <g fill="#fff">
      <rect x="585" y="860" width="18" height="230" />
      <rect x="628" y="860" width="18" height="230" />
      <rect x="671" y="860" width="18" height="230" />
      <rect x="714" y="860" width="18" height="230" />
    </g>
    <path d="M250 1030 h100 l18 60 h-136 z" fill="#4a4a4a" />
    <circle cx="300" cy="990" r="44" fill="#2b2b2b" />
    <path d="M420 1028 h100 l18 62 h-136 z" fill="#4a4a4a" />
    <circle cx="470" cy="986" r="44" fill="#2b2b2b" />
    <g fill="none" stroke="#fff" stroke-width="3">
      <circle cx="456" cy="990" r="11" />
      <circle cx="485" cy="990" r="11" />
    </g>
    <g fill="#fff" stroke="#111" stroke-width="6">
      <ellipse cx="330" cy="840" rx="200" ry="60" />
      <path d="M290 890 L296 940 L330 898 Z" />
    </g>
    <g fill="#fff">
      <ellipse cx="330" cy="840" rx="200" ry="60" />
      <path d="M290 890 L296 940 L330 898 Z" />
    </g>
    <text x="330" y="832" font-size="27">Then let's go</text>
    <text x="330" y="864" font-size="27">together!</text>
    <rect x="30" y="760" width="740" height="330" fill="none" stroke="#111" stroke-width="5" />
  </g>
</svg>
